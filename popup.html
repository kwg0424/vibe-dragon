<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>DragOn</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="icons/icon-32.png" alt="" />
    <span class="title">DragOn</span>
    <button type="button" id="manage" class="icon-btn settings" title="사이트 관리 · 설정"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </header>
  <p class="host" id="host" hidden></p>

  <main id="controls">
    <label class="row">
      <span>
        <b>우클릭 · 복사 허용</b>
        <small>우클릭 메뉴, 드래그 선택, 복사</small>
      </span>
      <input type="checkbox" id="copy" />
    </label>
    <label class="row">
      <span>
        <b>강력 모드</b>
        <small>기본으로 안 될 때만. 일부 기능이 깨질 수 있음</small>
      </span>
      <input type="checkbox" id="strong" />
    </label>
    <button id="reload" hidden>끄기 적용하려면 새로고침</button>
  </main>

  <p id="unsupported" hidden>이 페이지에서는 사용할 수 없습니다.</p>

  <p id="sync-msg" class="sync-msg error" hidden></p>

  <script src="popup.js"></script>
</body>
</html>
